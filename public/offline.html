<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#093076" />
    <title>OASIS — Connection needed</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 520px); border: 1px solid #dbe4ef; border-radius: 28px; background: white; padding: 36px; box-shadow: 0 20px 50px -30px rgba(15, 23, 42, .45); text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { margin: 22px 0 10px; font-size: 28px; letter-spacing: -.02em; }
      p { margin: 0; color: #52627a; font-size: 16px; line-height: 1.6; }
      button { margin-top: 24px; min-height: 46px; border: 0; border-radius: 13px; padding: 0 20px; background: #0f172a; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/oasis-192.png" alt="" />
      <h1>OASIS needs a connection</h1>
      <p>Reconnect to continue. Learner records are not stored for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
